[env]
FLOCI_DEFAULT_REGION = "eu-north-1"
#______________________________________________________________________________

[tools]
eza = "latest"

terraform = "latest"
"github:hashicorp/terraform-ls" = "latest"

"github:floci-io/floci-cli" = "latest"
#______________________________________________________________________________

[tasks.structure]
description = "🌲 View the project structure | alias = structure"
quiet = true
run = """

eza --tree --git-ignore

"""
#______________________________________________________________________________

[shell_alias]
structure = "mise run structure"
docker-toggle = "mise run docker-toggle"
#______________________________________________________________________________
